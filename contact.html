<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width'>
    <title>Contact</title>
    <link rel="stylesheet" href="reset.css">
</head>

<body>
    <main>
        <h1>Contact</h1>
        <p>If you'd like to get in touch, please use the email address below for project inquiries or general questions.</p>
        <p><strong>Email:</strong> contact [at] vineshbuilds.app</p>
        <p>You can also send a message using the messenger on this page.</p>
    </main>
    <script>
        window.$crisp = window.$crisp || [];
        window.CRISP_WEBSITE_ID = "3289a012-9831-4413-9574-2118579bee8b";

        (function () {
            function injectCrisp() {
                if (document.getElementById("crisp-chat-script")) return;

                var script = document.createElement("script");
                script.id = "crisp-chat-script";
                script.src = "https://client.crisp.chat/l.js";
                script.async = true;
                script.onerror = function () {
                    console.warn("Crisp chat failed to load.");
                };
                document.head.appendChild(script);
            }

            function scheduleCrisp() {
                if ("requestIdleCallback" in window) {
                    window.requestIdleCallback(injectCrisp, { timeout: 2000 });
                } else {
                    window.setTimeout(injectCrisp, 0);
                }
            }

            if (document.readyState === "complete") {
                scheduleCrisp();
            } else {
                window.addEventListener("load", scheduleCrisp, { once: true });
            }
        }());
    </script>
</body>

</html>
